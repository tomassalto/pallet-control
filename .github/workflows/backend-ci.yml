name: Backend CI

on:
  push:
    branches: [master, 'modernizacion/**', 'hardening/**']
  pull_request:

defaults:
  run:
    working-directory: pallet-backend

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, intl, exif, curl, dom, fileinfo
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            pallet-backend/package-lock.json
            pallet-frontend/package-lock.json

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: pallet-backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('pallet-backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend for integration tests
        working-directory: pallet-frontend
        run: npm ci && npm run build

      # 1. LINT — estilo de código
      - name: Lint (Pint)
        run: ./vendor/bin/pint --test

      # 2. STATIC — análisis estático (nivel 5, con baseline de deuda pre-existente)
      - name: Static analysis (Larastan / PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      # 3. TESTS — feature + unit, contra SQLite en memoria (ver phpunit.xml)
      - name: Tests
        run: php artisan test

      # 4. SECURITY — dependencias vulnerables
      - name: Security audit (composer audit)
        shell: bash
        run: |
          for intento in 1 2 3; do
            set +e
            composer audit
            estado=$?
            set -e

            if [ "$estado" -eq 0 ]; then
              exit 0
            fi

            # Composer usa 100 para fallos operativos (por ejemplo, red).
            # Los códigos de vulnerabilidades fallan de inmediato y no se ocultan.
            if [ "$estado" -ne 100 ] || [ "$intento" -eq 3 ]; then
              exit "$estado"
            fi

            echo "Packagist no respondió (intento $intento/3); se reintentará el audit."
            sleep $((intento * 5))
          done

      - name: Security audit (backend npm)
        run: npm ci && npm audit

      - name: Security audit (frontend npm)
        working-directory: pallet-frontend
        run: npm audit --audit-level=moderate

  postgres-concurrency:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pallet_control_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pallet_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, bcmath, gd, intl, exif, curl, dom, fileinfo
          coverage: none

      - name: Install dependencies
        working-directory: pallet-backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        working-directory: pallet-backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PostgreSQL concurrency gate
        working-directory: pallet-backend
        run: ./vendor/bin/phpunit --configuration phpunit.postgres.xml --group postgres

  container-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        shell: bash
        run: |
          set +e
          docker build --progress=plain --tag pallet-control:ci . 2>&1 | tee /tmp/docker-build.log
          estado=${PIPESTATUS[0]}
          set -e

          if [ "$estado" -ne 0 ]; then
            while IFS= read -r linea; do
              echo "::error::$linea"
            done < <(tail -n 40 /tmp/docker-build.log)
            exit "$estado"
          fi

      - name: Verify non-root runtime
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' pallet-control:ci)" = "www-data"
          test "$(docker run --rm --entrypoint id pallet-control:ci -u)" != "0"
          test -z "$(docker run --rm --entrypoint sh pallet-control:ci -c 'command -v composer || true')"
          docker run --rm --entrypoint sh pallet-control:ci -c 'test ! -e /app/pallet-backend/tests && test ! -e /app/pallet-backend/README.md'

      - name: Verify healthcheck contract
        run: |
          docker image inspect --format '{{json .Config.Healthcheck.Test}}' pallet-control:ci | grep -F '/ready'

      - name: Verify production debug guard
        run: |
          output="$(docker run --rm --entrypoint sh -e APP_ENV=production -e APP_DEBUG=true pallet-control:ci -c '. /deploy-env.sh && printf %s "$APP_DEBUG"')"
          test "$(printf %s "$output" | tail -n 1)" = "false"
